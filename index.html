<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NGL Message Sender - Premium</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>
      <span class="title-gradient">NGL Message Spam</span>
    </h1>

    <div class="disclaimer">
      <i class="fas fa-exclamation-triangle"></i>
      <strong> Peringatan:</strong> tools ini gratis dan jika ingin versi premium nya bisa kontak saya di instagram <b>@ujangkraz</b>.  
      gunakan dengan bijak dan bertanggung jawab.
    </div>

    <div class="form-card">
      <div class="form-group">
        <label for="nglLink"><i class="fas fa-user"></i> NGL Username or Link:</label>
        <input type="text" id="nglLink" placeholder="username or https://ngl.link/user" required>
      </div>

      <div class="form-group">
        <label for="message"><i class="fas fa-envelope"></i> Message:</label>
        <textarea id="message" rows="4" placeholder="Type your message here..." required></textarea>
      </div>

      <div class="settings-group">
        <div class="form-group">
          <label for="delay"><i class="fas fa-clock"></i> Delay (ms):</label>
          <input type="number" id="delay" value="3000" min="1000" required>
        </div>
        <div class="form-group">
          <label for="count"><i class="fas fa-hashtag"></i> Message Count:</label>
          <input type="number" id="count" value="10" min="1" max="100">
        </div>
      </div>

      <div class="premium-card">
        <div id="premiumStatus">Mode: Free</div>
        <input id="promoCodeInput" placeholder="Enter premium code">
        <button id="claimCodeBtn">Claim Premium</button>
        <div id="premiumMsg" class="small muted"></div>
      </div>
      
      <div class="button-group">
        <button id="startBtn"><i class="fas fa-play"></i> START</button>
        <button id="rushBtn" disabled><i class="fas fa-bolt"></i> RUSH MODE</button>
        <button id="stopBtn" disabled><i class="fas fa-stop"></i> STOP</button>
      </div>
    </div>

    <div class="progress-bar">
      <div class="progress" id="progress"></div>
    </div>

    <div class="stats">
      <span id="sentCount">Sent: 0</span>
      <span id="failedCount">Failed: 0</span>
      <span id="successRate">Success: 0%</span>
    </div>

    <div id="results"></div>
  </div>

  <script src="https://kit.fontawesome.com/9b91d4a3e7.js" crossorigin="anonymous"></script>
  <script src="script.js"></script>
</body>
</html>
